# Ausbaustufe 2: Broker, chat-service und Keycloak.
# Postgres kommt in Schritt 4 dazu (erst der batch-writer braucht sie),
# das web-gateway im nächsten Commit dieses Schrittes.
services:

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    networks:
      - chat-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  chat-service:
    build:
      context: .
      dockerfile: chat-service/Dockerfile
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - chat-net

  # Der Login-Dienst. Erreichbar wird er erst, wenn das web-gateway
  # /auth/** durchreicht -- einen eigenen Port bekommt er nie.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      # Diese drei Variablen entscheiden, ob der Login funktioniert.
      # Die Begründung steht in PLANUNG.md, Abschnitt 3.2.
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: http://localhost:8080/auth
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - ./keycloak/realm-chat.json:/opt/keycloak/data/import/realm-chat.json:ro
    networks:
      - chat-net

# KEIN Port-Mapping in dieser Datei. Der einzige offene Port des
# Gesamtsystems gehört dem web-gateway. Prüfbefehl: PLANUNG.md, Abschnitt 1.1.
networks:
  chat-net:
    name: chat-net
