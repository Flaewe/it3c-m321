# Ausbaustufe 2: Broker, chat-service, Keycloak und das web-gateway.
# Postgres kommt in Schritt 4 dazu -- erst der batch-writer braucht sie.
services:

  # Der einzige Dienst mit einem Port nach aussen. Er prüft die Tokens und
  # reicht Keycloak unter /auth durch, damit der Browser es erreichen kann.
  web-gateway:
    build:
      context: .
      dockerfile: web-gateway/Dockerfile
    ports:
      - "8080:8080"          # das EINZIGE Port-Mapping im ganzen System
    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/chat/protocol/openid-connect/certs
      # Muss zu KC_HOSTNAME unten passen, sonst scheitert jeder Login.
      KEYCLOAK_ISSUER_URI: http://localhost:8080/auth/realms/chat
    depends_on:
      # Absichtlich service_started und nicht service_healthy: Keycloak
      # bringt keinen Healthcheck mit, der in einer Zeile zu schreiben wäre
      # (offener Punkt 12). Das Gateway verträgt das, weil es den
      # öffentlichen Schlüssel erst bei der ersten Anfrage holt.
      keycloak:
        condition: service_started
    networks:
      - chat-net

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    networks:
      - chat-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  chat-service:
    build:
      context: .
      dockerfile: chat-service/Dockerfile
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - chat-net

  # Der Login-Dienst. Erreichbar wird er erst, wenn das web-gateway
  # /auth/** durchreicht -- einen eigenen Port bekommt er nie.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      # Diese drei Variablen entscheiden, ob der Login funktioniert.
      # Die Begründung steht in PLANUNG.md, Abschnitt 3.2.
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: http://localhost:8080/auth
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - ./keycloak/realm-chat.json:/opt/keycloak/data/import/realm-chat.json:ro
    networks:
      - chat-net

# Genau EIN Port-Mapping, oben beim web-gateway. Prüfbefehl siehe
# PLANUNG.md, Abschnitt 1.1.
networks:
  chat-net:
    name: chat-net
