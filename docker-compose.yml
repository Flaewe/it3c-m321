# Der Stack der Chat-App.
#
# Ein "docker compose up" startet alles: den Schreibweg (Broker,
# chat-service, Datenbank, batch-writer) und den Login (keycloak und
# web-gateway).
#
# Genau EIN Dienst veroeffentlicht einen Port: das web-gateway auf
# localhost:8080. Darueber ist die Web-App von aussen erreichbar. Alle
# anderen Dienste sprechen nur im internen Netz chat-net miteinander.
services:

  # Der einzige Dienst mit einem Port nach aussen. Er prüft die Tokens und
  # reicht Keycloak unter /auth durch, damit der Browser es erreichen kann.
  web-gateway:
    build:
      context: .
      dockerfile: web-gateway/Dockerfile
    ports:
      - "8080:8080"          # das EINZIGE Port-Mapping im ganzen System
    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/chat/protocol/openid-connect/certs
      # Muss zu KC_HOSTNAME unten passen, sonst scheitert jeder Login.
      KEYCLOAK_ISSUER_URI: http://localhost:8080/auth/realms/chat
    depends_on:
      # Absichtlich service_started und nicht service_healthy: Keycloak
      # bringt keinen Healthcheck mit, der in einer Zeile zu schreiben wäre
      # (offener Punkt 12). Das Gateway verträgt das, weil es den
      # öffentlichen Schlüssel erst bei der ersten Anfrage holt.
      keycloak:
        condition: service_started
    networks:
      - chat-net

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    networks:
      - chat-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  chat-service:
    build:
      context: .
      dockerfile: chat-service/Dockerfile
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - chat-net

  # Der einzige Dienst, der in die Datenbank schreibt.
  # Er veroeffentlicht keinen Port -- er hat keine Schnittstelle, die
  # jemand aufrufen koennte. Seine einzige Eingabe ist die Queue.
  batch-writer:
    build:
      context: .
      dockerfile: batch-writer/Dockerfile
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - chat-net

  # Die Datenbank. Nur der batch-writer schreibt hinein.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # depends_on allein wartet nur auf den Containerstart, nicht auf
      # Betriebsbereitschaft. Ohne diesen Healthcheck startet der
      # batch-writer schneller als die Datenbank und stirbt sofort.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - chat-net

  # Der Login-Dienst. Erreichbar wird er erst, wenn das web-gateway
  # /auth/** durchreicht -- einen eigenen Port bekommt er nie.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      # Diese drei Variablen entscheiden, ob der Login funktioniert.
      # Die Begründung steht in PLANUNG.md, Abschnitt 3.2.
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: http://localhost:8080/auth
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - ./keycloak/realm-chat.json:/opt/keycloak/data/import/realm-chat.json:ro
    networks:
      - chat-net

# Genau EIN Port-Mapping, oben beim web-gateway. Prüfbefehl siehe
# PLANUNG.md, Abschnitt 1.1.
networks:
  chat-net:
    name: chat-net

volumes:
  pgdata:
